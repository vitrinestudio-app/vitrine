baseURL = 'https://www.vitrinestudio.app/'
title = 'Vitrine Studio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# lastmod in the sitemaps comes from the Git history of each content file.
enableGitInfo = true
disableKinds = ['taxonomy', 'term', 'rss']

# No third parties: no analytics, no embedded services, no cookies.
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youTube]
    disable = true

[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en'
    weight = 1
    contentDir = 'content/en'
    [languages.en.params]
      description = 'Free, open-source desktop app for App Store and Google Play screenshots: design once, render every language and device, upload directly. With MCP and CLI.'
      # og:locale (Open Graph wants language_TERRITORY)
      ogLocale = 'en_US'
  [languages.de]
    languageName = 'Deutsch'
    languageCode = 'de'
    weight = 2
    contentDir = 'content/de'
    [languages.de.params]
      description = 'Kostenlose Open-Source-App für App-Store- und Google-Play-Screenshots: einmal gestalten, für jede Sprache und jedes Gerät rendern, direkt hochladen.'
      ogLocale = 'de_DE'

[params]
  github = 'https://github.com/vitrinestudio-app/vitrine'
  # Template gallery API: build-time snapshot (layouts/_partials/gallery/data.html)
  # and the live refresh in the browser (assets/js/gallery.js; the server needs
  # this site in VITRINE_API_CORS_ORIGINS). Local development:
  # HUGO_PARAMS_GALLERYAPI=http://127.0.0.1:8787 hugo server
  galleryAPI = 'https://api.vitrinestudio.app'
  company = 'Looking4Cache UG (haftungsbeschränkt)'
  # The downloads switch (website/README.md "Release switch"): on since
  # v1.0.0 was published (2026-11-13). While false, the download buttons say
  # "with the 1.0.0 release", the download page shows `lead_pending`, the home
  # page `notePending`/`aPending` and the `callout status pending` boxes appear.
  # Stable links (asset names have no version, docs/dev/releasing.md):
  # https://github.com/vitrinestudio-app/vitrine/releases/latest/download/VitrineStudio_macos_universal.dmg
  # …/VitrineStudio_windows_x64-setup.exe, …/VitrineStudio_linux_x86_64.AppImage
  downloads_available = true
  # Sponsoring (home page, open-source section, #funding). PLACEHOLDER URLs:
  # neither the GitHub Sponsors profile of the org nor the Liberapay account
  # exists yet. Until `sponsors_available = true` the page shows only an
  # "opens soon" note, never these links. Then also add .github/FUNDING.yml.
  sponsors_available = false
  [params.downloads]
    macos = 'https://github.com/vitrinestudio-app/vitrine/releases/latest/download/VitrineStudio_macos_universal.dmg'
    windows = 'https://github.com/vitrinestudio-app/vitrine/releases/latest/download/VitrineStudio_windows_x64-setup.exe'
    linux = 'https://github.com/vitrinestudio-app/vitrine/releases/latest/download/VitrineStudio_linux_x86_64.AppImage'
  [params.sponsors]
    github = 'https://github.com/sponsors/vitrinestudio-app'   # PLACEHOLDER
    liberapay = 'https://liberapay.com/vitrinestudio'          # PLACEHOLDER

# Remote resources (the template gallery snapshot, layouts/_partials/gallery/data.html)
# are fetched fresh on every build: no file cache.
[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = 0

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'
