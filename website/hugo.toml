baseURL = 'https://www.vitrinestudio.app/'
title = 'Vitrine Studio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'rss']

# No third parties: no analytics, no embedded services, no cookies.
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youTube]
    disable = true

[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en'
    weight = 1
    contentDir = 'content/en'
    [languages.en.params]
      description = 'Open-source desktop app for App Store and Google Play screenshots: design once on a continuous canvas, render for every language, device and store, upload directly – with an MCP server for AI assistants.'
  [languages.de]
    languageName = 'Deutsch'
    languageCode = 'de'
    weight = 2
    contentDir = 'content/de'
    [languages.de.params]
      description = 'Open-Source-Desktop-App für App-Store- und Google-Play-Screenshots: einmal auf einer durchgehenden Leinwand gestalten, für jede Sprache, jedes Gerät und jeden Store rendern, direkt hochladen – mit MCP-Server für KI-Assistenten.'

[params]
  github = 'https://github.com/vitrinestudio-app/vitrine'
  # Template gallery API: build-time snapshot (layouts/_partials/gallery/data.html)
  # and the live refresh in the browser (assets/js/gallery.js; the server needs
  # this site in VITRINE_API_CORS_ORIGINS). Local development:
  # HUGO_PARAMS_GALLERYAPI=http://127.0.0.1:8787 hugo server
  galleryAPI = 'https://api.vitrinestudio.app'
  company = 'Looking4Cache UG (haftungsbeschränkt)'
  # The downloads switch (website/README.md "Release switch"): set to true
  # and fill `downloads` below once the GitHub release is PUBLISHED (not
  # while it is a draft). While false, the download buttons say "with the
  # 1.0.0 release", the download page shows `lead_pending`, the home page
  # `notePending`/`aPending` and the `callout status pending` boxes appear.
  # Stable links (asset names have no version, docs/dev/releasing.md):
  # https://github.com/vitrinestudio-app/vitrine/releases/latest/download/VitrineStudio_macos_universal.dmg
  # …/VitrineStudio_windows_x64-setup.exe, …/VitrineStudio_linux_x86_64.AppImage
  downloads_available = false
  # Sponsoring (home page, open-source section, #funding). PLACEHOLDER URLs:
  # neither the GitHub Sponsors profile of the org nor the Liberapay account
  # exists yet. Until `sponsors_available = true` the page shows only an
  # "opens soon" note, never these links. Then also add .github/FUNDING.yml.
  sponsors_available = false
  [params.downloads]
    macos = ''
    windows = ''
    linux = ''
  [params.sponsors]
    github = 'https://github.com/sponsors/vitrinestudio-app'   # PLACEHOLDER
    liberapay = 'https://liberapay.com/vitrinestudio'          # PLACEHOLDER

# Remote resources (the template gallery snapshot, layouts/_partials/gallery/data.html)
# are fetched fresh on every build: no file cache.
[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = 0

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'
