[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Looking4Cache/arrangia"
homepage = "https://arrangia.app"
# No `license` field yet: the license is still undecided (see README, "Open questions").
# Every crate sets `publish = false` until the license and crates.io names are settled.

[workspace.dependencies]
# Internal crates
arrangia-core = { path = "crates/core" }
arrangia-render = { path = "crates/render" }
arrangia-publish = { path = "crates/publish" }
arrangia-mcp = { path = "crates/mcp" }

# Serialization (project files are YAML, see docs/KONZEPT.md 3.1)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# serde_yaml is deprecated and serde_yml is unmaintained; serde-saphyr is actively
# maintained, pure Rust, panic-free and supports both serialize and deserialize.
serde-saphyr = "2.1.1"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Async / networking (publish crate only, core stays network-free)
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart"] }
jsonwebtoken = "11.1.0"

# Storage and secrets
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring = "4.2.0"

# Rendering (to be confirmed by the Phase 0 spike)
tiny-skia = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6.1.0"
png = "0.18.1"
# Image header parsing (dimensions only) for core::resolve / core::validate; pure Rust, no deps.
imagesize = "0.14.0"
skrifa = "0.44.0"
# Text layout (docs/adr/0001-render-pipeline.md, 0003-text-markup-and-layout.md).
# No system font discovery: only bundled/project fonts are used.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
# SVG assets (logos, backgrounds). No text/system fonts, no raster images inside SVGs.
resvg = { version = "0.49.0", default-features = false }

# Front ends
clap = { version = "4.6.7", features = ["derive"] }
rmcp = "3.9.0"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
# File dialogs, used from Rust only (the web view keeps `core:default`).
tauri-plugin-dialog = "2.8.4"

# GUI session: file watching, platform folders, dev HTTP bridge
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
directories = "6.0.0"
# Dev-only HTTP bridge (`arrangia-devbridge`, feature `devbridge`); not shipped.

# Testing
insta = { version = "1.49.0", features = ["yaml"] }
proptest = "1.12.0"
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Geometry code converts between lu, px and f32/f64 constantly.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
# Image decoding/resampling is painfully slow unoptimized; keep our own code debuggable.
opt-level = 2
