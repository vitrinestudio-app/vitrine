[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/vitrinestudio-app/vitrine"
homepage = "https://www.vitrinestudio.app"
# GPL-3.0-or-later with a contributor licence agreement (ADR 0022, LICENSE, CLA.md).
license = "GPL-3.0-or-later"
authors = ["Looking4Cache UG (haftungsbeschränkt)"]
# Every crate sets `publish = false` until the crates.io names are settled.

[workspace.dependencies]
# Internal crates
vitrine-core = { path = "crates/core" }
vitrine-render = { path = "crates/render" }
vitrine-publish = { path = "crates/publish" }
vitrine-mcp = { path = "crates/mcp" }
vitrine-app = { path = "crates/app" }

# Serialization (project files are YAML, see docs/KONZEPT.md 3.1)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# serde_yaml is deprecated and serde_yml is unmaintained; serde-saphyr is actively
# maintained, pure Rust, panic-free and supports both serialize and deserialize.
serde-saphyr = "2.1.1"

# Translation exchange (core::exchange): CSV and XLIFF, both pure Rust.
csv = "1.4.0"
quick-xml = "0.42.0"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Async / networking (publish crate only, core stays network-free)
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "multipart"] }
jsonwebtoken = "11.1.0"
# Store clients (vitrine-publish): MD5 for the App Store Connect commit
# checksum, wiping key material, test-time key generation (aws-lc-rs is
# already rustls' crypto backend, so no second crypto stack).
md-5 = "0.10.6"
# Upload plan hashes and confirm tokens (vitrine-app::upload).
sha2 = "0.10.9"
zeroize = "1.9.1"
aws-lc-rs = "1.19.0"

# Storage and secrets
rusqlite = { version = "0.41.1", features = ["bundled"] }
# keyring 4 (`v1` feature) picks the platform store; keyring-core gives the
# store API and the in-memory mock used by tests and `VITRINE_KEYRING=mock`.
keyring = "4.2.0"
keyring-core = "1.0.1"

# Rendering (to be confirmed by the Phase 0 spike)
tiny-skia = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6.1.0"
png = "0.18.1"
# Colour management (core::colorspace, ADR 0021): pure-Rust CMS, same version
# the `image` crate already depends on (no second copy).
moxcms = "0.8.1"
# Image header parsing (dimensions only) for core::resolve / core::validate; pure Rust, no deps.
imagesize = "0.14.0"
# Frame package import (core::frame_import): zip archives with a pure-Rust
# deflate backend (flate2 → miniz_oxide), no C zlib.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
skrifa = "0.44.0"
# Text layout (docs/adr/0001-render-pipeline.md, 0003-text-markup-and-layout.md).
# No system font discovery: only bundled/project fonts are used.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
# SVG assets (logos, backgrounds). No text/system fonts, no raster images inside SVGs.
resvg = { version = "0.49.0", default-features = false }

# Front ends
clap = { version = "4.6.7", features = ["derive"] }
# Official MCP SDK (exact pin: the API moves fast). `transport-streamable-http-server`
# is enabled by vitrine-mcp's `http` feature (GUI-hosted server, Phase 4.3b).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
# JSON schemas of the MCP tool arguments (same major version as rmcp uses).
schemars = "1.2.3"
base64 = "0.23.0"
# GUI-hosted MCP endpoint (vitrine-mcp feature `http`, ADR 0015): hyper 1 serves
# rmcp's tower service on 127.0.0.1; the bearer token comes from getrandom.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tower-service = "0.3.3"
tokio-util = "0.7.20"
getrandom = "0.3.4"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
# File dialogs, used from Rust only (the web view keeps `core:default`).
tauri-plugin-dialog = "2.8.4"

# GUI session: file watching, platform folders, dev HTTP bridge
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
directories = "6.0.0"
# Dev-only HTTP bridge (`vitrine-devbridge`, feature `devbridge`); not shipped.

# Testing
insta = { version = "1.49.0", features = ["yaml"] }
proptest = "1.12.0"
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Geometry code converts between lu, px and f32/f64 constantly.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
# Image decoding/resampling is painfully slow unoptimized; keep our own code debuggable.
opt-level = 2
