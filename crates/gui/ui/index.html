<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arrangia</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/controls.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/canvas.css" />
    <link rel="stylesheet" href="styles/textedit.css" />
    <link rel="stylesheet" href="styles/translations.css" />
    <link rel="stylesheet" href="styles/assets.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app" class="app" hidden>
      <header class="topbar" id="topbar"></header>
      <aside class="sidebar sidebar-left" id="sidebar"></aside>
      <main class="center">
        <section class="view" id="view"></section>
        <footer class="bottombar" id="bottombar"></footer>
      </main>
      <aside class="sidebar sidebar-right" id="inspector"></aside>
    </div>
    <div id="welcome" class="welcome" hidden>
      <h1 data-i18n="app.title">Arrangia</h1>
      <p data-i18n="app.tagline"></p>
      <p class="muted"><span data-i18n="project.none"></span></p>
      <button id="open-project" class="btn btn-primary" type="button" data-i18n="project.open"></button>
      <p class="muted small"><span data-i18n="app.version"></span> <span id="app-version">…</span></p>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
