[package]
name = "vitrine-gui"
description = "Vitrine Studio desktop editor (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "vitrine-gui"

[lib]
name = "vitrine_gui"
path = "src/lib.rs"

[[bin]]
name = "vitrine-gui"
path = "src/main.rs"

# Dev harness: serves ui/ and the commands over HTTP for browser-based
# checks (docs/adr/0008). Never part of the release bundle.
[[bin]]
name = "vitrine-devbridge"
path = "src/bin/vitrine-devbridge.rs"
required-features = ["devbridge"]

[features]
devbridge = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
vitrine-app.workspace = true
# The GUI hosts the MCP endpoint (ADR 0015).
vitrine-mcp = { workspace = true, features = ["http"] }
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# examples/preview_transport.rs
vitrine-core.workspace = true
vitrine-render.workspace = true
png.workspace = true
# Enables the bridge for the integration tests (`cargo test --all`).
vitrine-gui = { path = ".", features = ["devbridge"] }

[lints]
workspace = true
