[package]
name = "arrangia-mcp"
description = "Arrangia MCP server (rmcp) on top of the shared application layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[features]
# Streamable HTTP server transport for the GUI-hosted server (Phase 4.3b).
# Served by the GUI (and the dev bridge with `--mcp`), see `host`.
http = [
    "rmcp/transport-streamable-http-server",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower-service",
    "dep:tokio-util",
    "dep:getrandom",
]
# `arrangia mcp` as a stdio proxy to a running GUI (the CLI enables it).
proxy = ["dep:reqwest"]

[dependencies]
arrangia-core.workspace = true
arrangia-app.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
png.workspace = true
