# Store locale codes and the default mapping project language → store locale
# (KONZEPT §7.2, Phase 5.1). Loaded by `arrangia_core::catalog::store_locales`
# (embedded at build time).
#
# A project language resolves to a store locale in this order:
#   1. the project's explicit map (`store.locales.<store>` in project.yaml)
#   2. the language itself when it is a store code (case-insensitive: `pt-BR`)
#   3. `defaults` below for the full tag (`zh-Hans`, `es-419`)
#   4. `defaults` for the primary subtag (`de-AT` → `de` → `de-DE`)
# Otherwise the language has no store locale (validation warns).
#
# Field reference
#   checked     date the lists were last verified (YYYY-MM-DD)
#   sources     key → {url, kind, note}
#   <store>     apple | google
#     source    source key of the code list
#     locales   every code the store accepts: {code, name}
#     defaults  project language tag → store code (must be one of `locales`)

checked: 2026-11-10

sources:
  AL:
    url: https://developer.apple.com/documentation/appstoreconnectapi/managing-metadata-in-your-app-by-using-locale-shortcodes
    kind: primary
    note: >-
      "Locale shortcodes" table (50 languages), read 2026-11-10 via the
      page's documentation JSON. Language names only also on
      https://developer.apple.com/help/app-store-connect/reference/app-store-localizations
  GL:
    url: https://support.google.com/googleplay/android-developer/answer/9844778?hl=en
    kind: primary
    note: >-
      "View list of available languages" (86 codes), read 2026-11-10.
      Hebrew uses the legacy code iw-IL. These codes are the `language`
      parameter of the Android Publisher API v3 edits.listings / edits.images.

