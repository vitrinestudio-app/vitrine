creative:
  # Header and search results assets exist only in the asset library (no
  # legacy endpoint). Shown on iOS/iPadOS 27+ (R1). Their group ids are not
  # in the public docs: every group of the type on these platforms whose
  # specs accept the image gets a placement ("1 header per placement group").
  header:
    placement_types: [PRODUCT_PAGE_HEADER_ASSET]
    platforms: [IPHONE_APP_STORE, IPAD_APP_STORE, ANY]
  search_results:
    placement_types: [APP_STORE_SEARCH_RESULTS_ASSET]
    platforms: [IPHONE_APP_STORE, IPAD_APP_STORE, ANY]
  # One universal 16:9 asset (5244x2950, png) placed as both.
  universal:
    placement_types: [PRODUCT_PAGE_HEADER_ASSET, APP_STORE_SEARCH_RESULTS_ASSET]
    platforms: [IPHONE_APP_STORE, IPAD_APP_STORE, ANY]

category:
  APP_SCREENSHOT: APP_SCREENSHOTS_AND_PREVIEWS
  IMESSAGE_APP_SCREENSHOT: APP_SCREENSHOTS_AND_PREVIEWS
  APP_PREVIEW: APP_SCREENSHOTS_AND_PREVIEWS
  PRODUCT_PAGE_HEADER_ASSET: CREATIVE_ASSETS
  APP_STORE_SEARCH_RESULTS_ASSET: CREATIVE_ASSETS
