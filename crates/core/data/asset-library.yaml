# App Store Connect App Asset Library mapping (ASC API 4.5.1, ADR 0019).
# Loaded by `arrangia_core::catalog::asset_library` (embedded at build time).
#
# Apple's placement *groups* (`IPHONE_DYNAMIC_ISLAND_LARGE_PROFILE`, …) are
# runtime strings from `GET /v1/appAssetLibraryRefData` and must not be
# hard-coded. This file only maps Arrangia's store slots to the *enum*
# values Apple documents (placement types, display classes, platforms);
# the upload resolves the group at runtime:
#
#   group ∈ refdata.placementProfileGroups
#     with displayClassId == display_class (if given) and platform ∈ platforms
#   ∩ refdata.placementTypes[placement_type].specMappings[].placementGroupId
#   → several left: the one whose specs accept the image size; else the first
#
# `arrangia upload refdata` prints the real catalog (and how these rows
# resolve) so the mapping can be checked with a real key.
#
# Field reference
#   checked       date the enums below were verified (YYYY-MM-DD)
#   sources       key → {url, kind, note}
#   screenshots   legacy display type (`store: {apple: {display_type}}`) →
#     placement_type   AppAssetLibraryPlacementType
#     display_class    AppAssetLibraryDisplayClass
#     platforms        AppAssetLibraryPlacementPlatform values to accept
#     asset_library_only  true: the set-based API has no such display type
#                      (only the asset library can upload it)
#     note             why / what is uncertain
#   creative      `store: {apple: {placement}}` value (header,
#                 search_results, universal) → placements
#     placement_types  one placement per type (universal asset: two)
#     platforms        groups of these platforms get a placement each
#                      (every matching group whose specs accept the image)
#   category      asset category per placement type (fixed at reservation)

checked: 2026-11-10

sources:
  AAL:
    url: https://developer.apple.com/documentation/appstoreconnectapi/understanding-the-app-asset-library
    kind: primary
    note: >-
      With "Discovering asset specifications", "Placing assets on your App
      Store surfaces", "Migrating to the App Asset Library", "Uploading and
      managing image assets" and the 4.5.1 release notes, read 2026-11-10
      via the pages' documentation JSON.
  ENUMS:
    url: https://developer.apple.com/documentation/appstoreconnectapi/appassetlibrarydisplayclass
    kind: primary
    note: >-
      AppAssetLibraryDisplayClass, AppAssetLibraryPlacementType,
      AppAssetLibraryPlacementPlatform, AppAssetLibraryAssetCategory,
      read 2026-11-10.
  R1:
    url: https://developer.apple.com/help/app-store-connect/reference/app-information/creative-assets-specifications
    kind: primary
    note: >-
      Header (21:9 3840x1646, universal 16:9 5244x2950) and search results
      (3:2) assets, iOS/iPadOS 27 only (research 2026-11-10).

