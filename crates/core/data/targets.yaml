    gallery: none
    rules: apple-creative-universal
    region: {pages: [0, 3]}
    fit: cover
    requirement: optional
    status: verified
    note: >-
      One PNG for both placements (header and search results; the asset
      library creates one placement per type). Default region: the first
      four pages (about 16:9 for portrait pages).
    sources: [AC1, AC2, AAL]

