# Vitrine Studio target presets (KONZEPT §6.4): store screenshot sizes, store slots
# and store rules. Loaded by `vitrine_core::catalog` (embedded at build time).
#
# All values checked on 2026-11-09 against the sources below. Map store
# screenshot sets by PIXEL SIZE, not by the API enum name: Apple kept the old
# `screenshotDisplayType` identifiers (APP_IPHONE_67, APP_IPHONE_61 …) and
# changed which device sizes they accept.
#
# Field reference
#   checked     date all values were last verified (YYYY-MM-DD)
#   sources     key → {url, kind, note}; kind = primary | secondary | forum | measured | convention
#   rules       store rule sets, referenced by presets (`rules:`); used by validation
#     count            images per set (per localization): {min, max}
#     formats          allowed export formats (png = 24-bit PNG)
#     alpha            false = alpha channel / transparency not allowed
#     sizes            exact = the image must have one of the preset's sizes;
#                      range = any size within min_side/max_side/max_ratio/aspects
#     min_side/max_side  pixel limits per side
#     max_ratio        long side / short side must be <= this
#     aspects          allowed aspect ratios (either orientation listed explicitly)
#     max_file_size    bytes, null = not documented
#     decorations      false = only the bare app UI is allowed: no device
#                      frames, texts, backgrounds (Wear OS); default true
#   presets     one entry per screenshot set / banner format
#     id, label, store (apple | google | none), platform (ios | ipados | macos |
#     watchos | android | chromeos | wearos | web), kind (pages | banner;
#     default pages)
#     sizes        {portrait: [[w, h] …], landscape: [[w, h] …]}; first = default
#     slot         store slot as in project targets: {apple: {display_type}} /
#                  {google: {image_type}}; absent = no API upload slot.
#                  App Store creative assets (header / search results) add
#                  `placement: header | search_results | universal`; their
#                  display_type is the App Asset Library placement type
#                  (uploaded only through the asset library, ADR 0018)
#     screenshot_only  new targets export each page's screenshot alone
#                  (no frame, background or text; watch / Wear OS)
#     safe_area    {top, right, bottom, left} insets in % of the image;
#                  absent = not published (validation then has nothing to
#                  check; set it on the project target once measured)
#     region, fit  banner presets: default region of the canvas and fit
#                  (page ranges are clamped to the canvas)
#     gallery      default gallery profile (galleries.yaml)
#     device       default device model (devices.yaml); screenshots = default
#                  screenshot variant key
#     requirement  required | conditional | optional (for publishing). required =
#                  needed for every app on the preset's platform; validation
#                  (`required_store_set_missing`, App Store and Google Play)
#                  asks for it once the project targets that platform in that
#                  store (iPad/Mac: has such a target); presets sharing a slot
#                  are filled by any target with that slot
#     status       verified (primary source) | secondary (only third-party
#                  sources for part of the entry, see note) | unverified |
#                  convention (no store rule, common practice)

checked: 2026-11-09

sources:
  A1:
    url: https://developer.apple.com/help/app-store-connect/reference/app-information/screenshot-specifications
    kind: primary
  A2:
    url: https://developer.apple.com/documentation/appstoreconnectapi/screenshotdisplaytype
    kind: primary
  A3:
    url: https://developer.apple.com/app-store/product-page/
    kind: primary
  ASC:
    url: https://appstoreconnect.apple.com/
    kind: primary
    note: >-
      App Store Connect web app, device configuration table and API, checked
      2026-11-09 (logged in, read-only): the uploader's per-display-type size
      table in the web app bundle, the `appScreenshotSets` of an existing app
      and the media manager UI (which sets are required).
  F1:
    url: https://github.com/fastlane/fastlane/blob/master/deliver/lib/deliver/app_screenshot.rb
    kind: secondary
  F3:
    url: https://github.com/fastlane/fastlane/pull/30444
    kind: secondary
  AF1:
    url: https://developer.apple.com/forums/thread/845505
    kind: forum
  G1:
    url: https://support.google.com/googleplay/android-developer/answer/9866151?hl=en
    kind: primary
    note: >-
      Feature graphic re-checked 2026-11-11: 1024x500, "JPEG or 24-bit PNG
      (no alpha)", required to publish; no file size limit stated (the
      1024 KB limit there is the icon's). Also in G4.
  G4:
    url: https://support.google.com/googleplay/android-developer/answer/1078870
    kind: primary
    note: >-
      Graphic assets guidance, checked 2026-11-11: feature graphic focal
      point centred, key content away from the edges, avoid device imagery,
      no "Best"/"#1"/"Free" or Play badges.
  G2:
    url: https://developers.google.com/android-publisher/api-ref/rest/v3/AppImageType
    kind: primary
  G3:
    url: https://androidpublisher.googleapis.com/$discovery/rest?version=v3
    kind: primary
  OG:
    url: https://ogp.me/
    kind: convention
  AC1:
    url: https://developer.apple.com/help/app-store-connect/reference/app-information/creative-assets-specifications
    kind: primary
    note: >-
      Creative assets (product page header, search results, universal),
      checked 2026-11-10: header 21:9 3840x1646 exact (jpeg/png); search
      results 3:2 from 1920x1280 to 3840x2560 (jpeg/png); universal 16:9
      5244x2950 (png only); no alpha. iOS/iPadOS 27 and later. Re-checked
      2026-11-11: unchanged; no colour space, file size limit or numeric
      safe area published.
  AC2:
    url: https://developer.apple.com/app-store/asset-best-practices/
    kind: primary
    note: >-
      Safe area "defined in each template" (Figma/Photoshop/Pixelmator/
      Sketch); no numbers published (2026-11-10).
  AAL:
    url: https://developer.apple.com/documentation/appstoreconnectapi/understanding-the-app-asset-library
    kind: primary
    note: >-
      App Asset Library (ASC API 4.5/4.5.1): placement types
      PRODUCT_PAGE_HEADER_ASSET and APP_STORE_SEARCH_RESULTS_ASSET, display
      classes IPHONE_DUO and WATCH_*; checked 2026-11-10.
  DUO:
    url: https://developer.apple.com/news/?id=kkphp5qo
    kind: primary
    note: >-
      iPhone Duo news (2026-10-05): uploads open in App Store Connect;
      screenshots required from April 2027 (A1: for apps built with the iOS
      27.1 SDK or later).
  WF1:
    url: https://developer.apple.com/forums/thread/815829
    kind: forum
    note: >-
      Watch screenshots are plain screen captures; the store applies its
      own watch mask (no official framing rule).

# Store API slot values. Apple: complete `ScreenshotDisplayType` enum (A2,
# fetched 2026-11-09; no descriptions, no Duo value). Google: `AppImageType`
# (G2) without `appImageTypeUnspecified`. A preset slot outside these lists
# must have `status: unverified`.
store_slots:
  apple: [
    APP_IPHONE_67, APP_IPHONE_65, APP_IPHONE_61, APP_IPHONE_58, APP_IPHONE_55,
    APP_IPHONE_47, APP_IPHONE_40, APP_IPHONE_35,
    APP_IPAD_PRO_3GEN_129, APP_IPAD_PRO_3GEN_11, APP_IPAD_PRO_129, APP_IPAD_105, APP_IPAD_97,
    APP_WATCH_ULTRA, APP_WATCH_SERIES_10, APP_WATCH_SERIES_7, APP_WATCH_SERIES_4, APP_WATCH_SERIES_3,
    APP_DESKTOP, APP_APPLE_TV, APP_APPLE_VISION_PRO,
    IMESSAGE_APP_IPHONE_67, IMESSAGE_APP_IPHONE_65, IMESSAGE_APP_IPHONE_61, IMESSAGE_APP_IPHONE_58,
    IMESSAGE_APP_IPHONE_55, IMESSAGE_APP_IPHONE_47, IMESSAGE_APP_IPHONE_40,
    IMESSAGE_APP_IPAD_PRO_3GEN_129, IMESSAGE_APP_IPAD_PRO_3GEN_11, IMESSAGE_APP_IPAD_PRO_129,
    IMESSAGE_APP_IPAD_105, IMESSAGE_APP_IPAD_97,
    # App Asset Library placement types of creative assets (AAL), used with
    # `placement:`; not ScreenshotDisplayType values.
    PRODUCT_PAGE_HEADER_ASSET, APP_STORE_SEARCH_RESULTS_ASSET,
  ]
  google: [
    phoneScreenshots, sevenInchScreenshots, tenInchScreenshots, tvScreenshots,
    wearScreenshots, icon, featureGraphic, tvBanner,
  ]

rules:
  apple-screenshots:
    label: App Store screenshots
    store: apple
    count: {min: 1, max: 10}
    formats: [png, jpeg]
    alpha: false
    sizes: exact
    max_file_size: null
    note: >-
      Per device size and localization (A1). Colour space and maximum file
      size are not documented on the current Apple pages. Only the largest
      required size is needed; App Store Connect scales down for smaller
      classes.
    sources: [A1, A3]

  google-screenshots:
    label: Google Play screenshots (phone)
    store: google
    count: {min: 2, max: 8}
    formats: [png, jpeg]
    alpha: false
    sizes: range
    min_side: 320
    max_side: 3840
    max_ratio: 2.0
    max_file_size: 8388608
    note: >-
      Up to 8 per device type; at least 2 screenshots across all device types
      to publish. Recommended: at least 4, 9:16 >= 1080x1920 or 16:9 >=
      1920x1080. The 8 MB limit is primary-sourced on G1 only for Android XR;
      for phone/tablet it comes from the Play Console UI as quoted by
      secondary sources. API transport limit is 15 MB (G3).
    sources: [G1, G2, G3]

  google-large-screens:
    label: Google Play screenshots (7"/10" tablet, Chromebook)
    store: google
    count: {min: 4, max: 8}
    formats: [png, jpeg]
    alpha: false
    sizes: range
    min_side: 1080
    max_side: 3840
    aspects: ["16:9", "9:16"]
    max_file_size: 8388608
    note: >-
      Minimum of 4 is needed to be shown/featured on large screens. G1's
      large-screen section allows sides up to 7680 px but the general rule
      says max 3840 px; we use the stricter 3840. 8 MB: see
      google-screenshots.
    sources: [G1]

  google-feature-graphic:
    label: Google Play feature graphic
    store: google
    count: {min: 1, max: 1}
    formats: [png, jpeg]
    alpha: false
    sizes: exact
    max_file_size: null
    note: >-
      Required to publish. Keep key content away from the edges and centred;
      avoid pure white/black/dark grey backgrounds; avoid device imagery
      (G4). File size limit not stated on G1 (API transport limit 15 MB,
      G3). Checked 2026-11-11.
    sources: [G1, G3, G4]

  apple-creative-header:
    label: App Store product page header
    store: apple
    count: {min: 1, max: 1}
    formats: [png, jpeg]
    alpha: false
    sizes: exact
    max_file_size: null
    note: >-
      Optional creative asset, one per placement and localization (per App
      Store version, custom product page, PPO treatment). Shown on iOS 27 /
      iPadOS 27 and later. No prices, URLs, (c), awards or other platforms;
      suitable for 4+. Safe area only in Apple's templates (AC2).
    sources: [AC1, AC2, AAL]

  apple-creative-search:
    label: App Store search results asset
    store: apple
    count: {min: 1, max: 1}
    formats: [png, jpeg]
    alpha: false
    sizes: range
    min_side: 1280
    max_side: 3840
    aspects: ["3:2"]
    max_file_size: null
    note: >-
      Optional creative asset, 3:2 between 1920x1280 and 3840x2560, one per
      localization; replaces the first screenshots in search results (iOS
      27+). Rules as for the header (AC2).
    sources: [AC1, AC2, AAL]

  apple-creative-universal:
    label: App Store universal creative asset
    store: apple
    count: {min: 1, max: 1}
    formats: [png]
    alpha: false
    sizes: exact
    max_file_size: null
    note: >-
      One 16:9 PNG (5244x2950) serving both the header and the search
      results placement ("Use header asset in search results"); PNG only.
    sources: [AC1, AC2, AAL]

  google-wear:
    label: Google Play Wear OS screenshots
    store: google
    count: {min: 1, max: 8}
    formats: [png, jpeg]
    alpha: false
    sizes: range
    min_side: 384
    max_side: 3840
    aspects: ["1:1"]
    max_file_size: 8388608
    decorations: false
    note: >-
      1:1, at least 384x384, the app interface only: no device frames, extra
      text, graphics or backgrounds, no transparency or masking; current
      Wear OS version. 8 MB as for the other Play screenshots.
    sources: [G1, G2]

