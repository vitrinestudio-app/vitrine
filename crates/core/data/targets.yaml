  # ------------------------------------------------------- App Store creative assets
  # Product page header and search results assets (iOS / iPadOS 27+):
  # optional, one image per localization, rendered from a region of a canvas
  # like any banner. Upload only through the App Asset Library (AAL).
  # Safe area: NOT PUBLISHED as numbers; Apple defines it only in its design
  # templates (AC2). `safe_area` stays unset until measured from the
  # templates; set it on the project target to get the overlay and the
  # `text_outside_safe_area` warning.
  - id: ios-header
    label: App Store product page header (21:9)
    store: apple
    platform: ios
    kind: banner
    sizes:
      landscape: [[3840, 1646]]
    slot: {apple: {display_type: PRODUCT_PAGE_HEADER_ASSET, placement: header}}
    gallery: none
    rules: apple-creative-header
    fit: cover
    requirement: optional
    status: verified
    note: >-
      Whole canvas by default (cover, centred, top kept); pick a page range or
      a free rectangle as the region. Safe area not published (see above).
    sources: [AC1, AC2, AAL]

  - id: ios-search-results
    label: App Store search results asset (3:2)
    store: apple
    platform: ios
    kind: banner
    sizes:
      landscape: [[3840, 2560], [2880, 1920], [1920, 1280]]
    slot: {apple: {display_type: APP_STORE_SEARCH_RESULTS_ASSET, placement: search_results}}
    gallery: none
    rules: apple-creative-search
    region: {pages: [0, 2]}
    fit: cover
    requirement: optional
    status: verified
    note: >-
      Any 3:2 size from 1920x1280 to 3840x2560. Default region: the first
      three pages (three portrait pages are about 3:2, like the three
      screenshots search shows without it).
    sources: [AC1, AC2, AAL]

  - id: ios-creative-universal
