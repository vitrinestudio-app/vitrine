# File-name mapping for the Apple Design Resources "Product Bezels"
# (KONZEPT §4.2, docs/adr/0012-imported-frames.md). Data, not code: new
# Apple packages are supported by adding rules here. Loaded by
# `arrangia_core::frame_import` (embedded at build time). Per-file
# assignments made by the user live in the app-wide frame store
# (`<app data>/frames/apple/user-mapping.yaml`) and take precedence.
#
# Arrangia never ships, downloads or commits these images: the user downloads
# the bezels from https://developer.apple.com/design/resources/ and imports
# the DMG / ZIP / folder; the files go to the app data folder only.
#
# STATUS: the iPhone 15+, iPhone Duo and Watch Ultra rules are verified with real packages
# (Bezel-iPhone-18.dmg, 2026-11-10, rules marked `verified:`): PNGs named
# `iPhone 18 Pro Max - <Colour> - <Portrait|Landscape>.png` and
# `iPhone 18 Pro - <Colour> - <Portrait|Landscape>.png`, colours Black,
# Burgundy, Glacier, Silver, screen offsets 66–76 px (Pro Max 1320×2868 at
# 75,66 portrait; Pro 1206×2622 at 72,69), next to Photoshop files and a
# `License.rtf`; the DMG has a licence agreement (SLA) the user accepts in
# Finder. All other rules (notch / home iPhones, iPad, Mac) are still
# built from documentation and secondary sources (no `verified:`).
# Sources (checked 2026-11-10):
#   - https://developer.apple.com/design/resources/ (one `Bezel-*.dmg` per
#     device family, e.g. Bezel-iPhone-17.dmg, Bezel-iPad-Pro-(M5).dmg,
#     Bezel-MacBook-Air-M5.dmg, Bezel-iMac-M4.dmg)
#   - https://github.com/joshluongo/frameme (real file name
#     `iPhone 14 Pro - Space Black - Portrait.png`)
#   - https://github.com/jonnyjackson26/device-frames-media,
#     https://github.com/weirdapps/mockups,
#     https://github.com/arturs105/device-framer (bezel sizes = screen plus
#     a ~100 px margin, transparent screen area, portrait + landscape for
#     phones/tablets, no orientation for Macs)
#   iPad and Mac name patterns are educated guesses (low confidence).
#
# Matching
#   Only the file name is matched (folders are ignored), without the `.png`
#   extension, case-insensitively. Before matching, en/em dashes become `-`,
#   typographic quotes become `"`, runs of white space become one space.
#   Rules are tried top to bottom; the first match wins.
#
#   pattern placeholders
#     {color}        the colour name (non-empty, never contains ` - `, so
#                    `MacBook Pro 14 - M4 - Space Black` gives `Space Black`);
#                    stored as a slug
#                    (`Black Titanium` → `black-titanium`, see color_aliases)
#     {orientation}  `Portrait` or `Landscape`
#     {*}            any text (also empty)
#   rule fields
#     model          catalog model id (devices.yaml) the frame stands in for
#     orientation    orientation when the pattern has no {orientation}
#                    (Macs: landscape)
#     priority       tie-break of the automatic bezel choice in resolve
#                    (several vendor models per model × colour × orientation,
#                    e.g. iPhone 18 Pro and 18 Pro Max, are all installed;
#                    resolve picks by target page size, screenshot size,
#                    aspect, then priority); also picks between duplicate
#                    files of one vendor model (default 0)
#     verified       date the rule was checked against a real package
#     note           free text
#   skip             {pattern, reason}: files that are deliberately not
#                    imported (tried before the rules, shown as ignored)
#   The vendor model (`iPhone 18 Pro`) is the file name before the colour;
#   projects may pin it with `bezel: iPhone 18 Pro`.

source: apple
label: Apple Design Resources (Product Bezels)
# Not every rule is verified (see `verified:` per rule).
verified: false

# Apple colour name (case-insensitive) → colour id. Everything else is
# slugified (iPhone 18 Pro: Black → black, Burgundy → burgundy, Glacier →
# glacier, Silver → silver; no aliases needed).
color_aliases:
  "(PRODUCT)RED": product-red
  "Space Grey": space-gray

# Files that are not a frame for one screen (listed as ignored).
skip:
  - pattern: "iPhone Duo - {color} - Outer Open"
    reason: marketing composite (back and outer display, open flat), no single-screen target

rules:
  # ---- iPhone with notch (iPhone X … 13, 14 / 14 Plus, 16e)
  - pattern: "iPhone X{*} - {color} - {orientation}"
    model: iphone-notch
  - pattern: "iPhone 11{*} - {color} - {orientation}"
    model: iphone-notch
  - pattern: "iPhone 12{*} - {color} - {orientation}"
    model: iphone-notch
  - pattern: "iPhone 13{*} - {color} - {orientation}"
    model: iphone-notch
  - pattern: "iPhone 14 Pro{*} - {color} - {orientation}"
    model: iphone-island
    priority: 10
    note: first generation with Dynamic Island
  - pattern: "iPhone 14{*} - {color} - {orientation}"
    model: iphone-notch
  - pattern: "iPhone 16e - {color} - {orientation}"
    model: iphone-notch
  # ---- iPhone with Dynamic Island (15 and later)
  - pattern: "iPhone 1{*}Pro Max - {color} - {orientation}"
    model: iphone-island
    priority: 30
    verified: 2026-11-10
    note: 6.9" Pro Max (screen 1320×2868), App Store slot ios-iphone-69
  - pattern: "iPhone 1{*} - {color} - {orientation}"
    model: iphone-island
    priority: 20
    verified: 2026-11-10
    note: iPhone 15 … 18 incl. Plus / Pro (18 Pro screen 1206×2622, slot ios-iphone-63)
  - pattern: "iPhone Air{*} - {color} - {orientation}"
    model: iphone-island
    priority: 15
  # ---- iPhone Duo (book-style foldable; Bezel-iPhone-Duo.dmg, user's
  # package 2026-11-10): `iPhone Duo - <Night Sky|Star White> - <View>.png`,
  # views `Inner Open Portrait|Landscape` (2247×3093, screen ≈ 2007×2853),
  # `Outer Closed Portrait|Landscape` (1574×2194, screen ≈ 1398×2034) and
  # `Outer Open` (skipped, see `skip`). Partially open views are PSD only.
  - pattern: "iPhone Duo - {color} - Inner Open {orientation}"
    model: iphone-duo
    priority: 10
    verified: 2026-11-10
    note: inner display, open (slot ios-iphone-duo-inner)
  - pattern: "iPhone Duo - {color} - Outer Closed {orientation}"
    model: iphone-duo-folded
    priority: 10
    verified: 2026-11-10
    note: outer display, closed (slot ios-iphone-duo-outer)
  # ---- Apple Watch (Bezel-Apple-Watch-Ultra-4-2026.dmg, user's package
  # 2026-11-10): `AW Ultra 4 - <Case> + <Band>.png`, all 620×940 (case with
  # band, portrait only, no orientation in the name), cases Black / Natural.
  # The band is part of the colour key (`natural-trail-loop-sand`) so all
  # case × band combinations are installed side by side.
  - pattern: "AW Ultra{*} - {color}"
    model: watch-ultra
    orientation: portrait
    priority: 10
    verified: 2026-11-10
    note: colour = case + band; screenshot 422×514 (slot watch-ultra)
  - pattern: "AW Series{*} - {color}"
    model: watch
    orientation: portrait
    priority: 10
    note: guessed from the Ultra package (`AW Series <n> - <Case> + <Band>`), unverified
  # ---- iPhone with home button
  - pattern: "iPhone SE{*} - {color} - {orientation}"
    model: iphone-home
  - pattern: "iPhone 8{*} - {color} - {orientation}"
    model: iphone-home
  # ---- iPad
  - pattern: "iPad Pro{*} - {color} - {orientation}"
    model: ipad-modern
    priority: 30
    note: iPad Pro 13" matches the catalog aspect 2064:2752 best
  - pattern: "iPad Air{*} - {color} - {orientation}"
    model: ipad-modern
    priority: 20
  - pattern: "iPad mini{*} - {color} - {orientation}"
    model: ipad-modern
    priority: 5
  - pattern: "iPad (10th generation){*} - {color} - {orientation}"
    model: ipad-modern
    priority: 10
  - pattern: "iPad ({*}generation){*} - {color} - {orientation}"
    model: ipad-home
    note: iPad up to the 9th generation (home button)
  - pattern: "iPad{*} - {color} - {orientation}"
    model: ipad-modern
    priority: 10
    note: iPad (A16) / 10th generation
  # ---- Mac (no orientation in the file name)
  - pattern: "MacBook Pro{*} - {color}"
    model: macbook
    orientation: landscape
    priority: 20
  - pattern: "MacBook{*} - {color}"
    model: macbook
    orientation: landscape
    priority: 10
  - pattern: "iMac{*} - {color}"
    model: imac
    orientation: landscape
