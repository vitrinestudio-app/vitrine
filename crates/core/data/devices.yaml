# Vitrine Studio device catalog (KONZEPT §4.1): data for the built-in parametric
# frames. Our own generic artwork, no vendor graphics: the shapes resemble
# device classes but do not reproduce any product. Drawing is done in
# `vitrine-render` (styles `stylized` and `detailed`). Loaded by
# `vitrine_core::catalog` (embedded at build time).
#
# Geometry
#   unit         model unit of the numbers (mm for hardware, px for the
#                browser window, nominal for `none`). Only ratios matter: the
#                renderer scales the outer width to the element's `width` (lu).
#   natural      orientation the geometry is given in. `landscape` for a
#                portrait-natural device = the frame rotated 90° counter-
#                clockwise (the top edge goes to the left, like an iPhone held
#                with the island on the left); the screenshot is not rotated.
#   body         housing (laptops: the lid; desktops: the screen housing):
#                {w, h, radius}, origin = top-left corner of the body
#   rim          thickness of the metal rim (`detailed` style)
#   display      visible display area {x, y, w, h, radius} relative to body
#   cutouts      kind: island | notch | punch_hole (drawn over the
#                screenshot, inside the display) or home_button | camera |
#                speaker (in the bezel, outside the display);
#                shape: pill | circle | notch | rect; {x, y, w, h, radius}
#   buttons      {name, edge: left|right|top|bottom, at, length, depth,
#                style}: `at` = start along the edge from the top/left body
#                corner, `depth` = how far the button sticks out of the body;
#                style plain (default) | crown (watch crown, ribbed
#                cylinder) | guard (raised part of the housing, body colour)
#   hinge        foldables: {at: center|left, w}; center = vertical hinge
#                through the body (crease line on the display, seams in the
#                bezel), left = spine along the left edge (closed)
#   fold         foldables: {state: open|folded, other: <model id>}: the
#                model of the other fold state (`fold:` on a device element
#                switches to it; both entries link to each other and share
#                the colours)
#   laptop       hinge {w, h} centred below the lid, base {w, h, radius,
#                lip {w, h}} centred below the hinge (front view)
#   stand        desktop stand: neck {w, h} centred below the body, foot
#                {w, h, radius} centred below the neck
#   browser      true = the body is a browser window drawn with
#                `browser_chrome`; the display is its content area
#   colors       names from the `colors` palette; default_color = default
#   screenshot   aspect (portrait-natural devices: portrait w:h) or `free`,
#                variant = default screenshot variant key, sizes = typical
#                raw screenshot sizes, targets = target presets
#                (targets.yaml) whose sizes match the display within 2 %

# Named colour variants. `body`/`edge` are the flat colours of the
# `stylized` style; `rim` = light/mid/dark of the material gradient and
# `glass` = front glass around the display in the `detailed` style.
colors:
  black-titanium: {label: Black titanium, body: "#2C2C30", edge: "#1C1C1F", rim: ["#8A8A90", "#3C3C41", "#1B1B1E"], glass: "#060607"}
  natural-titanium: {label: Natural titanium, body: "#D8D6D1", edge: "#BEBCB7", rim: ["#F2F1EE", "#BEBCB7", "#7E7C78"], glass: "#060607"}
  white-titanium: {label: White titanium, body: "#EDEDEB", edge: "#D6D6D3", rim: ["#FFFFFF", "#E3E2DF", "#A9A8A5"], glass: "#060607"}
  midnight: {label: Midnight, body: "#1C1C1F", edge: "#111113", rim: ["#2C2C30", "#1C1C1F", "#111113"], glass: "#1C1C1F"}
  porcelain: {label: Porcelain, body: "#F4F4F2", edge: "#D9D9D6", rim: ["#FFFFFF", "#F4F4F2", "#D9D9D6"], glass: "#F4F4F2"}
  black: {label: Black, body: "#232325", edge: "#121213", rim: ["#3A3A3C", "#232325", "#121213"], glass: "#0A0A0B"}
  silver: {label: Silver, body: "#E3E4E6", edge: "#C7C8CA", rim: ["#F5F5F7", "#D6D6D8", "#9C9CA0"], glass: "#060607"}
  space-gray: {label: Space gray, body: "#7D7E80", edge: "#5E5F61", rim: ["#9A9A9E", "#6E6E73", "#3E3E42"], glass: "#060607"}
  starlight: {label: Starlight, body: "#EAE4D7", edge: "#D2CAB8", rim: ["#F7F2E8", "#E3DCCD", "#B5AD9C"], glass: "#060607"}
  silver-white: {label: Silver (white front), body: "#E3E4E6", edge: "#C7C8CA", rim: ["#F5F5F7", "#D6D6D8", "#9C9CA0"], glass: "#F7F7F7"}
  gold-white: {label: Gold (white front), body: "#EBD8C3", edge: "#D7BFA4", rim: ["#F6E7D6", "#E3CDB4", "#B59A7C"], glass: "#F7F7F7"}
  sage: {label: Sage, body: "#C3CDB9", edge: "#A6B29B", rim: ["#D8E0D2", "#B4C0AA", "#7E8B75"], glass: "#060607"}
  pastel-blue: {label: Pastel blue, body: "#9DB7D5", edge: "#7C98BC", rim: ["#C6D7EA", "#8FAACB", "#4F6E96"], glass: "#F5F5F7"}
  pastel-green: {label: Pastel green, body: "#A8CDB0", edge: "#86B392", rim: ["#CDE5D2", "#97BFA1", "#5A8A67"], glass: "#F5F5F7"}
  pastel-pink: {label: Pastel pink, body: "#E8B4B8", edge: "#D4949A", rim: ["#F5D6D8", "#E2A6AB", "#B06E75"], glass: "#F5F5F7"}

# Browser window chrome, used by the `browser` model and by `chrome: browser`
# on laptops/desktops. Values in px at `reference_width` content width; the
# renderer scales them with the display width.
browser_chrome:
  reference_width: 1440
  tab_bar: 40
  toolbar: 48
  window_radius: 10
  tab: {width: 240, radius: 8}
  url_field: {height: 32, radius: 16}
  traffic_lights: {left: 16, diameter: 12, spacing: 8}
  themes:
    light: {frame: "#DEE1E6", toolbar: "#FFFFFF", tab: "#FFFFFF", url_field: "#F1F3F4", text: "#1F1F1F", muted: "#5F6368"}
    dark: {frame: "#1F1F23", toolbar: "#35363A", tab: "#35363A", url_field: "#202124", text: "#E8EAED", muted: "#9AA0A6"}

