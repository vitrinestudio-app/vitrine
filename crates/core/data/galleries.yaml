# Vitrine Studio gallery profiles (KONZEPT §3.3): how a store shows the exported
# images side by side. Used for the gaps on the canvas (content in a gap is
# not exported) and for the gallery preview. Loaded by
# `vitrine_core::catalog` (embedded at build time).
#
# Units: lu relative to ONE EXPORTED IMAGE. With `basis: width` (default)
# 1000 lu = the image width; with `basis: height` 1000 lu = the image height
# (Google Play shows screenshots at a fixed height, so its gap is constant
# relative to the height). For a target with `group: 2` an image spans two
# pages, so the gap on the canvas is twice the value in page lu; see
# `GalleryProfile::gap_on_canvas`.
#
#   gap         space between two images
#   radius      corner radius of the images as shown; a number or {x, y}
#               (elliptical, x along the width, y along the height)
#   background  page colour behind the gallery (preview only)
#   background_dark  page colour in the store's dark mode (gallery preview
#               `render_gallery {background: dark}`, validation
#               `page_blends_with_store`). NOT YET MEASURED for any profile:
#               placeholders from the platform colours (iOS systemBackground
#               dark #000000, Material 3 dark surface #131314), added 2026-11-12:
#               https://developer.apple.com/design/human-interface-guidelines/dark-mode
#               https://m3.material.io/styles/color/static/baseline
#   measured    false   = NOT YET MEASURED, placeholder guess
#               web-css = measured from the store website's CSS/layout
#               fixed   = by definition (no store involved)
#   source      where the values come from (URL / method), note = details
#
# Web values measured 2026-11-09 with headless Chrome (apps.apple.com: Things 3
# listing, CSS `.shelf-grid__list--grid-type-ScreenshotPhone`; play.google.com:
# Spotify and Todoist listings, computed styles). Store websites change with
# every redesign: re-measure before relying on them.
#
# Native store apps (iOS App Store, Mac App Store, Play Store app) have NOT
# been measured; their values are placeholders.

checked: 2026-11-09

galleries:
  # ------------------------------------------------------------- App Store
  - id: appstore-iphone
    label: App Store (iOS app), iPhone
    gap: 45
    radius: 125
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: false  # NOT YET MEASURED – placeholder
    source: estimate, no official documentation
    note: >-
      Guess: roughly 8-10 pt gap at about 230 pt screenshot width (4-5 %),
      corners similar to the device display radius (web uses 12.8 %).
      Measure on a device.

  - id: appstore-iphone-web
    label: apps.apple.com (desktop), iPhone
    gap: 78
    radius: {x: 128, y: 124}
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: web-css
    source: https://apps.apple.com/us/app/things-3/id904237743
    note: >-
      Grid column-gap 20 px at viewport >= 1000 px; at 1440 px viewport the
      screenshots are 256 px wide → 7.8 % (range 6.6-9.25 % between 1100 and
      2000 px). Radius from class `iphone-d74`: `border-radius: 12.8% / 5.7%`
      (y = 5.7 % of the height of a 1290x2796 image = 124 lu); older classes
      use about 12-13 % of the width.

  - id: appstore-iphone-web-mobile
    label: apps.apple.com (mobile), iPhone
    gap: 69
    radius: {x: 128, y: 124}
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: web-css
    source: https://apps.apple.com/us/app/things-3/id904237743
    note: Viewport < 1000 px - 10 px gap at 144 px screenshot width (6.9 %).

  - id: appstore-ipad
    label: App Store (iPadOS/iOS app), iPad
    gap: 40
    radius: 20
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: false  # NOT YET MEASURED – placeholder
    source: estimate, no official documentation
    note: Guess based on the web values (3.4-4.4 % gap, ~1.3-1.9 % radius).

  - id: appstore-ipad-web
    label: apps.apple.com (desktop), iPad
    gap: 44
    radius: {x: 13, y: 14}
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: web-css
    source: apps.apple.com, Things 3 for iPad listing (CSS class `ScreenshotLarge`)
    note: >-
      Measured on a landscape 4:3 listing at 1280 px viewport - 452.5 px
      wide images, 20 px gap (4.4 %). Radius `1.3% / 1.9%` (landscape;
      portrait `1.9% / 1.3%`), y = 1.9 % of a 4:3 landscape height = 14 lu.

  - id: appstore-ipad-web-mobile
    label: apps.apple.com (mobile), iPad
    gap: 34
    radius: {x: 13, y: 14}
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: web-css
    source: apps.apple.com, Things 3 for iPad listing (CSS class `ScreenshotLarge`)
    note: 298 px wide landscape images, 10 px gap (3.4 %).

  - id: appstore-mac
    label: Mac App Store
    gap: 30
    radius: 10
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: false  # NOT YET MEASURED – placeholder
    source: estimate, no official documentation
    note: Neither the Mac App Store app nor the Mac listing on apps.apple.com has been measured.

  # ----------------------------------------------------------- Google Play
  - id: play-phone
    label: Play Store (Android app), phone
    basis: height
    gap: 40
    radius: 40
    background: "#FFFFFF"
    background_dark: "#131314"
    measured: false  # NOT YET MEASURED – placeholder
    source: estimate, no official documentation
    note: Guess - about 8 dp gap and 8 dp radius at roughly 200 dp screenshot height.

  - id: play-tablet
    label: Play Store (Android app), tablet / Chromebook
    basis: height
    gap: 40
    radius: 40
    background: "#FFFFFF"
    background_dark: "#131314"
    measured: false  # NOT YET MEASURED – placeholder
    source: estimate, no official documentation
    note: Same guess as play-phone.

  - id: play-web
    label: play.google.com (desktop)
    basis: height
    gap: 54
    radius: 27
    background: "#FFFFFF"
    background_dark: "#131314"
    measured: web-css
    source: https://play.google.com/store/apps/details?id=com.spotify.music
    note: >-
      Viewport 1280 px - screenshots 296 px high, 16 px gap (5.4 % of the
      height; 9.6 % of the width for 9:16), 8 px border-radius (2.7 %).
      Class names are obfuscated; measured from computed styles.

  - id: play-web-mobile
    label: play.google.com (mobile)
    basis: height
    gap: 59
    radius: 39
    background: "#FFFFFF"
    background_dark: "#131314"
    measured: web-css
    source: https://play.google.com/store/apps/details?id=com.spotify.music
    note: Viewport 390 px - 204 px high, 12 px gap (5.9 %), 8 px radius (3.9 %).

  # ---------------------------------------------------------------- Other
  - id: none
    label: No gallery (seamless)
    gap: 0
    radius: 0
    background: "#FFFFFF"
    background_dark: "#000000"
    measured: fixed
    source: by definition
    note: For banners and targets without a store gallery.
