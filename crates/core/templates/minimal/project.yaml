# Minimal Vitrine Studio project: one page with a headline and a device for the
# iPhone 6.9" App Store set (docs/KONZEPT.md §3). Put the screenshot in
# screenshots/<lang>/ios-phone/home.png or screenshots/<lang>/home.png;
# a missing screenshot is drawn as a placeholder.
format: vitrine/1
revision: 0
name: __NAME__
languages:
  default: __DEFAULT_LANG__
  available: __LANGS__
strips:
- id: main
  page: {aspect: 1320:2868, count: 1, ids: [home]}
  backgrounds:
  - "#EEF1F6"
  elements:
  - id: title
    kind: text
    page: 0
    anchor_y: top
    text: home.title
    box: {top: 160, left: 80, right: 80}
    align: center
    fit: {shrink_to: 56, max_lines: 3}
  - id: device
    kind: device
    page: 0
    anchor_y: bottom
    at: {x: 500, y: 1420}
    width: 700
    model: iphone-island
    screenshot: home
targets:
- id: ios-iphone-69
  strip: main
  size: [1320, 2868]
  screenshots: ios-phone
  gallery: appstore-iphone
  store: {apple: {display_type: APP_IPHONE_67}}
