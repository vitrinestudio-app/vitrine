[package]
name = "arrangia-cli"
description = "Arrangia command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "arrangia"
path = "src/main.rs"

[dependencies]
arrangia-core.workspace = true
arrangia-render.workspace = true
arrangia-mcp = { workspace = true, features = ["proxy"] }
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# tests/mcp_proxy.rs hosts the GUI's endpoint in-process.
arrangia-mcp = { workspace = true, features = ["proxy", "http"] }
arrangia-app.workspace = true
base64.workspace = true

[lints]
workspace = true
