[package]
name = "vitrine-cli"
description = "Vitrine Studio command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "vitrine"
path = "src/main.rs"

[dependencies]
vitrine-core.workspace = true
vitrine-render.workspace = true
vitrine-mcp = { workspace = true, features = ["proxy"] }
vitrine-app.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# tests/mcp_proxy.rs hosts the GUI's endpoint in-process.
vitrine-mcp = { workspace = true, features = ["proxy", "http"] }
base64.workspace = true

[lints]
workspace = true
