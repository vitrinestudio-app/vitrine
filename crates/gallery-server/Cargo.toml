[package]
name = "vitrine-gallery-server"
description = "Vitrine Studio template gallery backend (api.vitrinestudio.app): list, download, upload with validation, moderation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "vitrine-gallery"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# GitHub OAuth login for uploaders (ADR 0023). Design + stub routes only
# (TODO): the routes answer 501 until the flow is implemented.
github-oauth = []

[dependencies]
vitrine-core.workspace = true
vitrine-render.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tempfile.workspace = true
