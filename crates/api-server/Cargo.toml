[package]
name = "vitrine-api-server"
description = "Vitrine Studio backend (api.vitrinestudio.app): template gallery, GitHub login, moderation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "vitrine-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vitrine-core.workspace = true
vitrine-render.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# GitHub OAuth (device + web flow): token exchange and `GET /user`.
reqwest = { workspace = true, features = ["form"] }
# Session tokens and OAuth state: random values, stored as SHA-256 hashes;
# PKCE challenge (base64url of SHA-256).
getrandom.workspace = true
sha2.workspace = true
base64.workspace = true
# Gallery sprites (lossy WebP).
webp.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tempfile.workspace = true
wiremock.workspace = true
rusqlite.workspace = true
