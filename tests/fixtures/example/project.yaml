# Vitrine Studio example project (showcase and golden-test fixture).
#
# A fictional garden planner ("Fernwood") rendered for: iPhone 6.9" and
# 6.3", Google Play phone (device swap to an Android frame), iPad 13"
# landscape (two phone pages per image via `group: 2` + the
# `tablet-landscape` variant), Mac App Store (16:10), web slides (browser
# window and a notebook with browser chrome), a blog header, the Google
# Play feature graphic (1024x500, Android frames) and an Open Graph image. Languages: en (default), de, fr and fr-CA. Fallbacks on
# purpose: some German screenshots and all French ones except three phone
# screens are missing (→ en, info); fr-CA translates only two texts
# (Québec wording) and inherits the rest from fr via the automatic prefix
# chain fr-CA → fr → en (info, not a warning; no `languages.fallback`
# entry needed). Showcases of Phase 3: `title-companions` has a German
# language override (`langs.de`: wider box, larger `shrink_to`) so the
# opt-in `hyphenate` of the `headline` style breaks "Mischkultur-partner"
# instead of shrinking the headline; French texts use no-break spaces
# before `:` and a no-break space to keep "le bon moment" together.
#
# Screenshots are generated by `crates/render/examples/screens.rs`:
#   cargo run -p vitrine-render --release --example screens -- tests/fixtures/example/screenshots
# Export: cargo run -p vitrine-cli --release -- --project tests/fixtures/example export
# Golden references: crates/render/tests/golden.rs (golden/).
format: vitrine/1
revision: 1
name: Fernwood
languages:
  default: en
  available: [en, de, fr, fr-CA]
styles:
  colors:
    accent: "#F6C453"
    deep: "#0B3324"
    ink: "#17251C"
    leaf: "#2F7A47"
    muted: "#5E6B62"
    paper: "#FFFFFF"
    soft: "#D5EADB"
  text:
    callout: {font: Inter, weight: 400, size: 30, line_height: 1.28, color: "@ink"}
    desk-headline: {font: Inter Display, weight: 700, size: 46, line_height: 1.1, color: "@ink"}
    desk-sub: {font: Inter, weight: 400, size: 22, line_height: 1.35, color: "@muted"}
    headline: {font: Inter Display, weight: 700, size: 90, line_height: 1.08, color: "@paper", hyphenate: true}
    label: {font: Inter, weight: 600, size: 27, line_height: 1.25, color: "@muted"}
    score: {font: Inter Display, weight: 900, size: 92, line_height: 1, color: "@leaf"}
    sub: {font: Inter, weight: 400, size: 40, line_height: 1.3, color: "@soft"}
  spans:
    accent: {color: "@accent"}
    green: {color: "@leaf"}
  shadows:
    card:
      layers:
      - {color: "#0000004D", blur: 40, y: 22}
      - {color: "#00000026", blur: 8, y: 4}
    desk:
      layers:
      - {color: "#1B3A2440", blur: 30, y: 18}
      - {color: "#1B3A2426", blur: 6, y: 4}
strips:
- id: phone
  page: {aspect: 1320:2868, count: 6, ids: [plan, beds, companions, neighbours, harvest, calendar]}
  backgrounds:
  - kind: linear-gradient
    angle: 115
    stops: [["#0B3324", 0], ["#145A3C", 0.5], ["#1D5C68", 1]]
  elements:
  # Decoration running across all pages and gaps (home page 0).
  - id: band
    kind: shape
    page: 0
    at: {x: 3100, y: 1650}
    width: 9000
    height: 700
    rotation: -11
    anchor_y: center
    z: -10
    shape: rect
    fill: "#FFFFFF12"
  - id: band-line
    kind: shape
    page: 0
    at: {x: 3033, y: 1306}
    width: 9000
    height: 10
    rotation: -11
    anchor_y: center
    z: -9
    shape: rect
    fill: "@accent"
  # Page 1: hero
  - id: title-plan
    kind: text
    page: 0
    text: plan.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
  - id: sub-plan
    kind: text
    page: 0
    text: plan.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: phone-plan
    kind: device
    page: 0
    anchor_y: bottom
    at: {x: 500, y: 1390}
    width: 720
    model: iphone-island
    screenshot: home
    shadow: soft
  # Page 2: bed planner
  - id: title-beds
    kind: text
    page: 1
    text: beds.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
  - id: sub-beds
    kind: text
    page: 1
    text: beds.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: phone-beds
    kind: device
    page: 1
    anchor_y: bottom
    at: {x: 500, y: 1390}
    width: 720
    model: iphone-island
    color: natural-titanium
    screenshot: planner
    shadow: soft
  # Pages 3 + 4: one phone across the gap
  - id: title-companions
    kind: text
    page: 2
    text: companions.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
    langs:
      de: {box: {top: 170, left: 40, right: 40}, fit: {shrink_to: 76, max_lines: 2}}
  - id: sub-companions
    kind: text
    page: 2
    text: companions.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: title-neighbours
    kind: text
    page: 3
    text: neighbours.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
  - id: sub-neighbours
    kind: text
    page: 3
    text: neighbours.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: phone-spread
    kind: device
    page: 2
    anchor_y: bottom
    at: {x: 1000, y: 1600}
    width: 860
    rotation: -9
    model: iphone-island
    color: white-titanium
    screenshot: companions
    shadow: soft
  - id: card-good
    kind: shape
    page: 2
    anchor_y: bottom
    at: {x: 260, y: 1020}
    width: 420
    height: 150
    shape: rect
    radius: 40
    fill: "@paper"
    shadow: card
  - id: icon-good
    kind: image
    page: 2
    anchor_y: bottom
    at: {x: 120, y: 1020}
    width: 84
    height: 84
    asset: assets/icon-good.svg
  - id: text-good
    kind: text
    page: 2
    anchor_y: bottom
    at: {x: 315, y: 1020}
    width: 270
    text: callout.good
    style: callout
    fit: {shrink_to: 24, max_lines: 2}
  - id: card-bad
    kind: shape
    page: 2
    anchor_y: bottom
    at: {x: 260, y: 1210}
    width: 420
    height: 150
    shape: rect
    radius: 40
    fill: "@paper"
    shadow: card
  - id: icon-bad
    kind: image
    page: 2
    anchor_y: bottom
    at: {x: 120, y: 1210}
    width: 84
    height: 84
    asset: assets/icon-bad.svg
  - id: text-bad
    kind: text
    page: 2
    anchor_y: bottom
    at: {x: 315, y: 1210}
    width: 270
    text: callout.bad
    style: callout
    fit: {shrink_to: 24, max_lines: 2}
  - id: card-score
    kind: shape
    page: 3
    anchor_y: bottom
    at: {x: 715, y: 1180}
    width: 400
    height: 400
    shape: rect
    radius: 56
    fill: "@paper"
    shadow: card
  - id: ring-score
    kind: shape
    page: 3
    anchor_y: bottom
    at: {x: 715, y: 1130}
    width: 220
    height: 220
    shape: ellipse
    stroke: {color: "#5FAE6A", width: 18}
  - id: text-score
    kind: text
    page: 3
    anchor_y: bottom
    at: {x: 715, y: 1130}
    width: 300
    text: callout.score
    style: score
    align: center
  - id: label-score
    kind: text
    page: 3
    anchor_y: bottom
    at: {x: 715, y: 1307}
    width: 340
    text: callout.score_label
    style: label
    align: center
    fit: {shrink_to: 20, max_lines: 1}
  # Page 5: harvest
  - id: title-harvest
    kind: text
    page: 4
    text: harvest.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
  - id: sub-harvest
    kind: text
    page: 4
    text: harvest.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: phone-harvest
    kind: device
    page: 4
    anchor_y: bottom
    at: {x: 500, y: 1390}
    width: 720
    model: iphone-island
    screenshot: harvest
    shadow: soft
  # Page 6: calendar
  - id: title-calendar
    kind: text
    page: 5
    text: calendar.title
    style: headline
    box: {top: 170, left: 70, right: 70}
    align: center
    fit: {shrink_to: 64, max_lines: 2}
  - id: sub-calendar
    kind: text
    page: 5
    text: calendar.sub
    style: sub
    box: {top: 400, left: 90, right: 90}
    align: center
    fit: {shrink_to: 34, max_lines: 2}
  - id: phone-calendar
    kind: device
    page: 5
    anchor_y: bottom
    at: {x: 500, y: 1390}
    width: 720
    model: iphone-island
    color: natural-titanium
    screenshot: calendar
    shadow: soft
  variants:
    android:
      content_scale: 0.86
      overrides:
        phone-plan: {at: {x: 500, y: 1430}}
        phone-beds: {at: {x: 500, y: 1430}}
        phone-harvest: {at: {x: 500, y: 1430}}
        phone-calendar: {at: {x: 500, y: 1430}}
    tablet-landscape:
      content_scale: 0.92
      overrides:
        band: {at: {x: 3100, y: 1800}, rotation: -8}
        band-line: {at: {x: 3051, y: 1453}, rotation: -8}
        phone-plan: {at: {x: 500, y: 1683}}
        phone-beds: {at: {x: 500, y: 1683}}
        phone-harvest: {at: {x: 500, y: 1683}}
        phone-calendar: {at: {x: 500, y: 1683}}
        phone-spread: {at: {x: 1000, y: 1760}, rotation: -6}
        card-good: {at: {x: 260, y: 1600}}
        icon-good: {at: {x: 120, y: 1600}}
        text-good: {at: {x: 315, y: 1600}}
        card-bad: {at: {x: 260, y: 1790}}
        icon-bad: {at: {x: 120, y: 1790}}
        text-bad: {at: {x: 315, y: 1790}}
        card-score: {at: {x: 700, y: 1750}, height: 360}
        ring-score: {at: {x: 700, y: 1715}, width: 200, height: 200}
        text-score: {at: {x: 700, y: 1715}}
        label-score: {at: {x: 700, y: 1865}}
    banner:
      overrides:
        sub-plan: {visible: false}
        sub-beds: {visible: false}
        sub-companions: {visible: false}
        phone-spread: {at: {x: 500, y: 1390}, width: 720, rotation: 6}
        card-good: {visible: false}
        icon-good: {visible: false}
        text-good: {visible: false}
        card-bad: {visible: false}
        icon-bad: {visible: false}
        text-bad: {visible: false}
