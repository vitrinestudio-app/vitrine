    model: iphone-island
    screenshot: phone-sync
    shadow: desk
- id: web
  page: {aspect: 16:9, count: 2, ids: [plots, seeds]}
  backgrounds:
  - kind: linear-gradient
    angle: 135
    stops: [["#EAF3E6", 0], ["#F7F5EC", 0.6], ["#E5EEF2", 1]]
  elements:
  - id: web-logo
    kind: image
    page: 0
    at: {x: 92, y: 104}
    width: 64
    height: 64
    asset: assets/logo.svg
  - id: web-title-plots
    kind: text
    page: 0
    text: web.plots.title
    style: desk-headline
    box: {top: 160, left: 60, right: 650}
    fit: {shrink_to: 32, max_lines: 3}
  - id: web-sub-plots
    kind: text
    page: 0
    text: web.plots.sub
