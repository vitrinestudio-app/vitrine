- id: mac
  strip: mac
  size: [2880, 1800]
  screenshots: mac
  gallery: appstore-mac
  store: {apple: {display_type: APP_DESKTOP}}
- id: web-slides
  strip: web
  size: [1920, 1080]
  screenshots: web
  format: jpeg
  quality: 90
- id: blog-header
  kind: banner
  strip: phone
  variant: banner
  size: [2400, 1000]
  screenshots: ios-phone
  region: {rect: {page: 0, x: 0, y: 120, width: 3000, height: 1250}}
  fit: cover
  gaps: none
  format: jpeg
  quality: 88
- id: play-feature-graphic
  kind: banner
  strip: phone
  variant: banner
  size: [1024, 500]
  screenshots: android-phone
  device_map: {iphone-island: android-punchhole}
  region: {rect: {page: 0, x: 0, y: 40, width: 3000, height: 1465}}
  fit: cover
  gaps: none
  store: {google: {image_type: featureGraphic}}
- id: open-graph
  kind: banner
  strip: web
  size: [1200, 630]
  screenshots: web
  region: {pages: [0, 0]}
  fit: cover
  format: jpeg
  quality: 88
