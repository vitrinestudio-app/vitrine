    box: {top: 160, left: 700, right: 50}
    fit: {shrink_to: 32, max_lines: 3}
  - id: web-sub-seeds
    kind: text
    page: 1
    text: web.seeds.sub
    style: desk-sub
    box: {top: 330, left: 700, right: 50}
    fit: {shrink_to: 17, max_lines: 4}
targets:
- id: ios-iphone-69
  strip: phone
  size: [1320, 2868]
  screenshots: ios-phone
  gallery: appstore-iphone
  store: {apple: {display_type: APP_IPHONE_67}}
- id: ios-iphone-63
  strip: phone
  size: [1206, 2622]
  screenshots: ios-phone
  gallery: appstore-iphone
  store: {apple: {display_type: APP_IPHONE_61}}
- id: play-phone
  strip: phone
  variant: android
  size: [1080, 2160]
  screenshots: android-phone
  gallery: play-phone
  device_map: {iphone-island: android-punchhole}
  store: {google: {image_type: phoneScreenshots}}
- id: ios-ipad-13-landscape
  strip: phone
  variant: tablet-landscape
  group: 2
  size: [2752, 2064]
