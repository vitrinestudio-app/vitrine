# CLA Assistant Lite workflow – NOT active (ADR 0022, CONTRIBUTING.md).
#
# Alternative to the hosted CLA Assistant app (the recommended option).
# To enable: copy to `.github/workflows/cla.yml`, check the action's
# current release and maintenance status and pin it below, then push.
# Signatures are stored in `signatures/cla.json` on the branch `cla-signatures`
# of this repository (created on the first signature); with that, the built-in
# GITHUB_TOKEN is enough. To store them in a separate private repository
# instead, set `remote-organization-name`/`remote-repository-name` and create
# a fine-grained personal access token (contents: read/write on that
# repository) as repository secret `CLA_PAT`.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pin to the current release (or its commit SHA) before enabling.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for a remote signature repository:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-document: https://github.com/Looking4Cache/arrangia/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Looking4Cache,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please
            read the [Contributor Licence Agreement](https://github.com/Looking4Cache/arrangia/blob/main/CLA.md)
            and sign it by posting the comment below. You keep your copyright;
            the agreement grants the project owner a licence to your
            contribution.
          # remote-organization-name: Looking4Cache
          # remote-repository-name: vitrine-cla-signatures
          lock-pullrequest-aftermerge: false
